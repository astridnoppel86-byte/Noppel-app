<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noppel – Hausbau To-Do-Liste</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F6F6;
  --panel: #FFFFFF;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.15);
  --text: #111111;
  --text2: #444444;
  --text3: #888888;
  --col-astrid:  #7C3AED; --bg-astrid:  #EDE9FE; --txt-astrid:  #5B21B6;
  --col-philipp: #CA8A04; --bg-philipp: #FEFCE8; --txt-philipp: #854D0E;
  --col-thomas:  #0369A1; --bg-thomas:  #E0F2FE; --txt-thomas:  #075985;
  --green:  #16A34A; --green-bg:  #DCFCE7;
  --red:    #DC2626; --red-bg:    #FEE2E2;
  --orange: #EA580C; --orange-bg: #FFF0E6;
  --blue:   #2563EB; --blue-bg:   #DBEAFE;
  --radius: 14px; --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06),0 4px 16px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 28px rgba(0,0,0,0.11);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;position:relative;overflow-x:hidden;}

#bg-grundriss{position:fixed;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;opacity:0.22;z-index:0;pointer-events:none;filter:grayscale(75%) contrast(1.2);}
#bg-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(246,246,246,0.80);z-index:1;pointer-events:none;}
.app-wrap{position:relative;z-index:2;max-width:1300px;margin:0 auto;padding:0 32px 80px;}

.header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 22px;border-bottom:2px solid var(--border2);margin-bottom:28px;}
.logo-wrap{display:flex;align-items:center;gap:18px;}
.logo-svg{width:88px;height:auto;flex-shrink:0;overflow:visible;}
.logo-text-block{display:flex;flex-direction:column;gap:4px;}
.logo-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:500;color:#111;letter-spacing:0.05em;}
.logo-sub{font-size:11px;font-weight:700;color:#888;letter-spacing:0.2em;text-transform:uppercase;}
.header-right{display:flex;align-items:center;gap:16px;}
.user-badge{display:flex;align-items:center;gap:8px;padding:7px 16px;border-radius:40px;font-size:13px;font-weight:700;border:2px solid;cursor:default;}
.header-date{font-size:12px;color:var(--text3);letter-spacing:0.04em;}

.notif-bar{margin-bottom:18px;}
.notif{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:8px;border:2px solid;font-weight:600;animation:slideIn .3s ease;}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.notif-dismiss{margin-left:auto;cursor:pointer;opacity:.5;font-size:18px;line-height:1;}
.notif-dismiss:hover{opacity:1;}

.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.stat-card{background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow);}
.stat-val{font-size:30px;font-weight:800;color:#111;line-height:1;margin-bottom:4px;}
.stat-label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:0.09em;text-transform:uppercase;}

.layout{display:flex;gap:26px;align-items:flex-start;}
.sidebar{width:300px;flex-shrink:0;}
.main-area{flex:1;min-width:0;}

.sidebar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sidebar-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:500;color:#111;}
.btn-add{display:flex;align-items:center;gap:5px;padding:8px 16px;border-radius:40px;background:#111;color:#fff;font-size:12px;font-weight:700;border:none;cursor:pointer;letter-spacing:0.06em;transition:all .2s;font-family:'Inter',sans-serif;}
.btn-add:hover{background:#333;transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,0.25);}

.proj-list{display:flex;flex-direction:column;gap:10px;}
.proj-card{background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow);}
.proj-card:hover{border-color:var(--border2);transform:translateX(3px);box-shadow:var(--shadow-md);}
.proj-card.active{border-color:#111;border-width:2px;box-shadow:var(--shadow-md);}
.proj-card.completed{border-color:var(--green);background:#F0FDF4;}
.proj-card-name{font-size:14px;font-weight:600;color:#111;margin-bottom:8px;line-height:1.3;}
.proj-card.completed .proj-card-name{color:var(--green);}
.mini-timeline{position:relative;margin-bottom:8px;}
.mini-timeline-track{height:4px;border-radius:2px;background:rgba(0,0,0,0.08);overflow:hidden;}
.mini-timeline-fill{height:100%;border-radius:2px;transition:width .6s;}
.mini-timeline-labels{display:flex;justify-content:space-between;margin-top:4px;}
.mini-timeline-pct{font-size:11px;font-weight:800;}
.mini-timeline-dl{font-size:10px;color:var(--text3);}
.proj-card-assignees{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}

.detail-empty{background:var(--panel);border:1.5px dashed var(--border2);border-radius:var(--radius);padding:80px 40px;text-align:center;color:var(--text3);font-size:15px;}
.detail-panel{background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius);padding:32px 36px;box-shadow:var(--shadow-md);}
.detail-name{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;color:#111;margin-bottom:12px;line-height:1.2;}
.detail-name.completed{color:var(--green);}

.timeline-section{margin:18px 0 24px;}
.timeline-label-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.timeline-pct-big{font-size:26px;font-weight:800;}
.timeline-dl-label{font-size:13px;color:var(--text2);}
.timeline-track{height:10px;border-radius:5px;background:rgba(0,0,0,0.08);margin-bottom:6px;overflow:hidden;}
.timeline-fill{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.timeline-ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);}

.summary-box{background:#F3F3F3;border-left:3px solid #111;border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:14px 18px;margin-bottom:22px;font-size:13px;color:#111;line-height:2;}
.summary-box strong{font-weight:800;}
.detail-meta-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}

.deadline-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:40px;font-size:11px;font-weight:800;border:2px solid;}
.deadline-chip.ok  {background:var(--blue-bg);  color:var(--blue);  border-color:var(--blue);}
.deadline-chip.warn{background:var(--orange-bg);color:var(--orange);border-color:var(--orange);}
.deadline-chip.over{background:var(--red-bg);   color:var(--red);   border-color:var(--red);}
.deadline-chip.done{background:var(--green-bg); color:var(--green); border-color:var(--green);}

.avatar-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 4px;border-radius:40px;border:2px solid;font-size:12px;font-weight:700;}
.avatar-dot{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}

.tabs{display:flex;gap:2px;margin-bottom:20px;border-bottom:2px solid var(--border2);}
.tab-btn{padding:9px 20px;font-size:13px;font-weight:500;color:var(--text3);border:none;background:transparent;cursor:pointer;font-family:'Inter',sans-serif;transition:color .15s;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab-btn:hover{color:#111;}
.tab-btn.on{color:#111;border-bottom-color:#111;font-weight:700;}

.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.btn{padding:8px 18px;border-radius:40px;font-size:13px;font-weight:600;border:2px solid var(--border2);background:transparent;cursor:pointer;color:#111;transition:all .2s;font-family:'Inter',sans-serif;}
.btn:hover{background:#EBEBEB;}
.btn.primary{background:#111;color:#fff;border-color:#111;}
.btn.primary:hover{background:#333;border-color:#333;}
.btn.danger{color:var(--red);border-color:var(--red);}
.btn.danger:hover{background:var(--red-bg);}

.task-item{padding:16px 0;border-bottom:1.5px solid var(--border);}
.task-item:last-child{border-bottom:none;}
.task-header{display:flex;align-items:flex-start;gap:12px;}
.task-check{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(0,0,0,0.2);flex-shrink:0;cursor:pointer;margin-top:2px;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.task-check.on{background:var(--green);border-color:var(--green);}
.task-check.on::after{content:'';width:5px;height:9px;border:2.5px solid white;border-top:none;border-left:none;transform:rotate(45deg) translate(-1px,-1px);display:block;}
.task-body{flex:1;min-width:0;}
.task-title-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.task-title-txt{font-size:15px;font-weight:500;color:#111;line-height:1.4;}
.task-item.done .task-title-txt{text-decoration:line-through;color:var(--text3);}
.task-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
.task-pct-bar{flex:1;min-width:60px;max-width:150px;height:5px;border-radius:3px;background:rgba(0,0,0,0.08);overflow:hidden;}
.task-pct-fill{height:100%;border-radius:3px;}
.task-pct-label{font-size:11px;font-weight:800;min-width:32px;}
.task-actions{display:flex;gap:3px;margin-left:auto;}
.icon-btn{width:30px;height:30px;border-radius:7px;border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--text3);transition:all .15s;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:#EBEBEB;color:#111;}

.task-status-block{margin-top:10px;padding:11px 14px;background:#F7F7F7;border-radius:var(--radius-sm);border-left:3px solid #999;font-size:13px;line-height:1.6;}
.task-status-label{font-size:10px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);margin-bottom:3px;}
.task-result-block{margin-top:8px;padding:11px 14px;background:var(--green-bg);border-radius:var(--radius-sm);border-left:3px solid var(--green);font-size:13px;color:#14532D;line-height:1.6;font-weight:600;}

.log-entry{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.log-entry:last-child{border-bottom:none;}
.log-time{color:var(--text3);font-size:11px;white-space:nowrap;min-width:130px;padding-top:2px;}
.log-text{color:#111;flex:1;line-height:1.5;}

#modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:20px;}
#modal-overlay.open{display:flex;}
.modal-box{background:white;border-radius:var(--radius);padding:32px;width:100%;max-width:520px;box-shadow:var(--shadow-md);animation:modalIn .25s ease;max-height:90vh;overflow-y:auto;}
@keyframes modalIn{from{opacity:0;transform:scale(0.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:#111;margin-bottom:22px;}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;font-weight:800;color:#111;margin-bottom:5px;display:block;letter-spacing:0.09em;text-transform:uppercase;}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;padding:10px 12px;border:2px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;color:#111;background:white;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:#111;}
input[type=range]{width:100%;accent-color:#111;}
.range-row{display:flex;gap:10px;align-items:center;}
.range-val{font-size:16px;font-weight:800;color:#111;min-width:42px;text-align:right;}
.member-picker{display:flex;gap:8px;flex-wrap:wrap;}
.mp-chip{display:flex;align-items:center;gap:6px;padding:6px 14px 6px 7px;border-radius:40px;border:2px solid var(--border2);cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;color:#111;}
.form-row2{display:flex;gap:10px;}
.form-row2 .form-group{flex:1;}
.modal-actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;}

@media(max-width:900px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<div id="bg-grundriss"></div>
<div id="bg-overlay"></div>

<div class="app-wrap">
  <header class="header">
    <div class="logo-wrap">
      <!-- SVG Logo – Noppel mark. viewBox 0 0 260 275. All elements fit within bounds. -->
      <svg class="logo-svg" viewBox="0 0 260 275" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- N left vertical -->
        <line x1="20" y1="16" x2="20" y2="260" stroke="#111" stroke-width="9" stroke-linecap="round"/>
        <!-- N diagonal -->
        <line x1="20" y1="16" x2="112" y2="207" stroke="#111" stroke-width="9" stroke-linecap="round"/>
        <!-- N right stub bottom -->
        <line x1="112" y1="207" x2="112" y2="260" stroke="#111" stroke-width="9" stroke-linecap="round"/>
        <!-- Rectangle right block: x=112 y=16 w=128 h=212 → rightmost x=240 ✓ -->
        <rect x="112" y="16" width="128" height="212" stroke="#111" stroke-width="9" fill="none"/>
        <!-- Outer circle: cx=176 cy=122 r=76 → rightmost=252 ✓ leftmost=100 ✓ top=46 bottom=198 ✓ -->
        <circle cx="176" cy="122" r="76" stroke="#111" stroke-width="9" fill="none"/>
        <!-- Inner circle -->
        <circle cx="176" cy="122" r="46" stroke="#111" stroke-width="9" fill="none"/>
        <!-- Horizontal line through circle centre -->
        <line x1="97" y1="122" x2="252" y2="122" stroke="#111" stroke-width="9" stroke-linecap="round"/>
        <!-- Vertical line through circle centre -->
        <line x1="176" y1="44" x2="176" y2="200" stroke="#111" stroke-width="9" stroke-linecap="round"/>
        <!-- Diagonal: bottom-left corner of rect → top-right corner of rect -->
        <line x1="112" y1="228" x2="240" y2="16" stroke="#111" stroke-width="9" stroke-linecap="round"/>
      </svg>
      <div class="logo-text-block">
        <div class="logo-title">Noppel</div>
        <div class="logo-sub">Hausbau To-Do-Liste</div>
      </div>
    </div>
    <div class="header-right">
      <div class="header-date" id="headerDate"></div>
      <div class="user-badge" id="userBadge"></div>
    </div>
  </header>

  <div class="notif-bar" id="notifBar"></div>
  <div class="stats-grid" id="statsGrid"></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Projekte</div>
        <button class="btn-add" onclick="openModal('newProj')">+ Neu</button>
      </div>
      <div class="proj-list" id="projList"></div>
    </aside>
    <main class="main-area" id="mainArea">
      <div class="detail-empty">
        <div style="font-size:44px;margin-bottom:14px;opacity:.12">◎</div>
        Projekt auswählen
      </div>
    </main>
  </div>
</div>

<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

let state=loadState();
let activeUser=getUserFromURL();
let activeProjectId=null;
let detailTab='tasks';

function loadState(){
  try{const d=JSON.parse(localStorage.getItem('noppel_pm_v8')||'null');if(d&&d.projects&&d.projects.length>0)return d;}catch(e){}
  const s={projects:JSON.parse(JSON.stringify(SEED||[])),logs:[],reminders:[]};
  try{localStorage.setItem('noppel_pm_v8',JSON.stringify(s));}catch(e){}
  return s;
}
function saveState(){try{localStorage.setItem(SK,JSON.stringify(state));}catch(e){}}
function ts(){return new Date().toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function uid(){return 'x'+Math.random().toString(36).slice(2,10);}
function daysUntil(ds){if(!ds)return null;return Math.ceil((new Date(ds)-new Date())/86400000);}
function fmtDate(ds){if(!ds)return '';return new Date(ds).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'});}

function progColor(pct){
  if(pct>=100)return '#16A34A';
  if(pct>=60) return '#2563EB';
  if(pct>=30) return '#EA580C';
  return '#DC2626';
}

function avatarChip(uid2,small){
  const u=USERS[uid2];if(!u)return '';
  return `<span class="avatar-chip" style="border-color:${u.color};color:${u.txt};background:${u.bg}">
    <span class="avatar-dot" style="background:${u.color};color:white;width:20px;height:20px;font-size:9px">${u.short}</span>${small?'':u.name.split(' ')[0]}
  </span>`;
}
function avatarDot(uid2,sz){
  const u=USERS[uid2];if(!u)return '';
  const s=sz||22;
  return `<span class="avatar-dot" style="background:${u.color};color:white;width:${s}px;height:${s}px;font-size:${Math.round(s*.42)}px" title="${u.name}">${u.short}</span>`;
}

function deadlineChip(ds,done){
  if(!ds)return '';
  if(done)return `<span class="deadline-chip done">✓ Erledigt</span>`;
  const d=daysUntil(ds);
  if(d<0) return `<span class="deadline-chip over">⚠ Überfällig · ${fmtDate(ds)}</span>`;
  if(d<=7)return `<span class="deadline-chip warn">⏰ ${d}T · ${fmtDate(ds)}</span>`;
  return `<span class="deadline-chip ok">📅 ${fmtDate(ds)}</span>`;
}

function checkAndCreateReminders(p){
  if(!p.deadline||p.progress>=100)return;
  const d=daysUntil(p.deadline);
  [7,3,1].forEach(days=>{
    if(d!==null&&d<=days){
      const key=`auto_${p.id}_${days}`;
      if(!(state.reminders||[]).find(r=>r.key===key)){
        (p.assignees||[]).forEach(u=>{
          if(!state.reminders)state.reminders=[];
          state.reminders.push({id:'r'+Math.random().toString(36).slice(2,8),key,projectId:p.id,targetUser:u,
            message:`Noch ${d} Tag${d===1?'':'e'} bis zur Deadline!`,dueAt:new Date().toISOString(),dismissed:false,auto:true});
        });
      }
    }
  });
}

function visibleProjects(){
  if(!activeUser)return[];
  if(activeUser.isAdmin)return state.projects;
  return state.projects.filter(p=>(p.assignees||[]).includes(activeUser.id)||(p.createdBy===activeUser.id));
}

function recalcProgress(p){
  if(!p.tasks||p.tasks.length===0)return;
  p.progress=Math.round(p.tasks.reduce((s,t)=>s+(t.pct||0),0)/p.tasks.length);
}

function renderNotifs(){
  if(!activeUser){document.getElementById('notifBar').innerHTML='';return;}
  state.projects.forEach(checkAndCreateReminders);
  const bar=document.getElementById('notifBar');
  const active=(state.reminders||[]).filter(r=>!r.dismissed&&(r.targetUser===activeUser.id||r.targetUser==='all')&&new Date(r.dueAt)<=new Date());
  bar.innerHTML=active.map(r=>{
    const p=state.projects.find(x=>x.id===r.projectId);
    const isOver=daysUntil(p?.deadline)<0;
    return `<div class="notif" style="background:${isOver?'#FEE2E2':'#FFF0E6'};border-color:${isOver?'#DC2626':'#EA580C'};color:${isOver?'#991B1B':'#9A3412'}">
      <span>🔔</span><span><strong>${p?.name||'Projekt'}:</strong> ${r.message}</span>
      <span class="notif-dismiss" onclick="dismissNotif('${r.id}')">×</span></div>`;
  }).join('');
}
function dismissNotif(id){const r=(state.reminders||[]).find(x=>x.id===id);if(r)r.dismissed=true;saveState();renderNotifs();}

function renderStats(){
  const projs=visibleProjects();
  const done=projs.filter(p=>p.progress>=100).length;
  const inprog=projs.filter(p=>p.progress>0&&p.progress<100).length;
  const allT=projs.flatMap(p=>p.tasks||[]);
  const tDone=allT.filter(t=>t.done||t.pct>=100).length;
  const tTotal=allT.length;
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-card"><div class="stat-val">${projs.length}</div><div class="stat-label">Projekte</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#16A34A">${done}</div><div class="stat-label">Abgeschlossen</div></div>
    <div class="stat-card"><div class="stat-val" style="color:#2563EB">${inprog}</div><div class="stat-label">In Bearbeitung</div></div>
    <div class="stat-card"><div class="stat-val">${tTotal>0?Math.round(tDone/tTotal*100):0}%</div><div class="stat-label">${tDone}/${tTotal} Aufgaben</div></div>`;
}

function renderSidebar(){
  const projs=visibleProjects();
  document.getElementById('projList').innerHTML=projs.length===0
    ?'<div style="font-size:13px;color:#888;padding:12px 0">Noch keine Projekte.</div>'
    :projs.map(p=>{
      const col=progColor(p.progress||0);
      const isDone=(p.progress||0)>=100;
      return `<div class="proj-card${activeProjectId===p.id?' active':''}${isDone?' completed':''}" onclick="selectProject('${p.id}')">
        <div class="proj-card-name">${p.name}</div>
        <div class="mini-timeline">
          <div class="mini-timeline-track"><div class="mini-timeline-fill" style="width:${p.progress||0}%;background:${col}"></div></div>
          <div class="mini-timeline-labels">
            <span class="mini-timeline-pct" style="color:${col}">${p.progress||0}%</span>
            <span class="mini-timeline-dl">${p.deadline?fmtDate(p.deadline):''}</span>
          </div>
        </div>
        <div class="proj-card-assignees">${(p.assignees||[]).map(u=>avatarDot(u,20)).join('')}</div>
      </div>`;
    }).join('');
}

function renderDetail(){
  renderStats();
  if(!activeProjectId){document.getElementById('mainArea').innerHTML=`<div class="detail-empty"><div style="font-size:44px;margin-bottom:14px;opacity:.12">◎</div>Projekt auswählen</div>`;return;}
  const p=state.projects.find(x=>x.id===activeProjectId);if(!p)return;
  const isDone=(p.progress||0)>=100;
  const col=progColor(p.progress||0);
  const tasks=p.tasks||[];
  const tDone=tasks.filter(t=>t.pct>=100||t.done).length;
  const tOpen=tasks.filter(t=>(t.pct||0)<100&&!t.done).length;
  const tInProg=tasks.filter(t=>(t.pct||0)>0&&(t.pct||0)<100&&!t.done).length;
  const avgPct=tasks.length>0?Math.round(tasks.reduce((s,t)=>s+(t.pct||0),0)/tasks.length):(p.progress||0);

  const summaryHtml=`<div class="summary-box">
    <strong>Übersicht:</strong>&nbsp;
    ${tasks.length} Aufgabe${tasks.length!==1?'n':''}&nbsp;·&nbsp;
    <span style="color:#16A34A;font-weight:800">${tDone} erledigt</span>&nbsp;·&nbsp;
    ${tInProg>0?`<span style="color:#2563EB;font-weight:800">${tInProg} läuft</span>&nbsp;·&nbsp;`:''}
    <span style="color:#DC2626;font-weight:800">${tOpen} offen</span>
    ${tasks.length>0?`&nbsp;·&nbsp;Fortschritt: <strong>${avgPct}%</strong>`:''}
  </div>`;

  document.getElementById('mainArea').innerHTML=`<div class="detail-panel">
    <div class="detail-name${isDone?' completed':''}">${p.name}</div>
    <div class="detail-meta-row">
      ${deadlineChip(p.deadline,isDone)}
      ${(p.assignees||[]).map(u=>avatarChip(u,false)).join('')}
      ${p.createdBy?`<span style="font-size:11px;color:#888;font-weight:500">von ${USERS[p.createdBy]?.name||p.createdBy}</span>`:''}</div>
    <div class="timeline-section">
      <div class="timeline-label-row">
        <span class="timeline-pct-big" style="color:${col}">${p.progress||0}%</span>
        <span class="timeline-dl-label">${p.deadline?'Deadline: '+fmtDate(p.deadline):''}</span>
      </div>
      <div class="timeline-track"><div class="timeline-fill" style="width:${p.progress||0}%;background:${col}"></div></div>
      <div class="timeline-ticks"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div>
    </div>
    ${summaryHtml}
    <div class="action-row">
      <button class="btn primary" onclick="openModal('addTask')">+ Aufgabe</button>
      <button class="btn" onclick="openModal('editProj')">✎ Bearbeiten</button>
      <button class="btn" onclick="openModal('addStatus')">📝 Notiz</button>
      <button class="btn" onclick="openModal('addReminder')">🔔 Erinnerung</button>
    </div>
    <div class="tabs">
      <button class="tab-btn${detailTab==='tasks'?' on':''}" onclick="switchTab('tasks')">Aufgaben (${tasks.length})</button>
      <button class="tab-btn${detailTab==='log'?' on':''}" onclick="switchTab('log')">Protokoll</button>
    </div>
    <div id="tabContent">${renderTabContent(p)}</div>
  </div>`;
}

function renderTabContent(p){return detailTab==='tasks'?renderTasks(p):renderLog(p);}

function renderTasks(p){
  const tasks=p.tasks||[];
  if(tasks.length===0)return'<div style="padding:40px 0;text-align:center;color:#888;font-size:14px">Noch keine Aufgaben.</div>';
  return tasks.map(t=>{
    const col=progColor(t.pct||0);
    const isDone=t.pct>=100||t.done;
    const hasStatus=t.statusNote&&t.statusNote.trim();
    const hasResult=t.resultNote&&t.resultNote.trim();
    return `<div class="task-item${isDone?' done':''}">
      <div class="task-header">
        <div class="task-check${isDone?' on':''}" onclick="toggleTask('${p.id}','${t.id}')"></div>
        <div class="task-body">
          <div class="task-title-row">
            <span class="task-title-txt">${t.title}</span>
            <div class="task-actions">
              <button class="icon-btn" title="Status" onclick="openModal('taskStatus','${p.id}','${t.id}')">📝</button>
              <button class="icon-btn" title="Bearbeiten" onclick="openModal('editTask','${p.id}','${t.id}')">✎</button>
              <button class="icon-btn" title="Löschen" onclick="deleteTask('${p.id}','${t.id}')">✕</button>
            </div>
          </div>
          <div class="task-meta">
            <div class="task-pct-bar"><div class="task-pct-fill" style="width:${t.pct||0}%;background:${col}"></div></div>
            <span class="task-pct-label" style="color:${col}">${t.pct||0}%</span>
            ${t.deadline?deadlineChip(t.deadline,isDone):''}
            ${(t.assignees||[]).map(u=>avatarDot(u,20)).join('')}
          </div>
          ${hasStatus&&!isDone?`<div class="task-status-block"><div class="task-status-label">Aktueller Stand</div><div>${t.statusNote}</div></div>`:''}
          ${isDone||hasResult?`<div class="task-result-block">✓ <strong>Ergebnis:</strong> ${hasResult?t.resultNote:'Aufgabe abgeschlossen.'}</div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderLog(p){
  const logs=(state.logs||[]).filter(l=>l.projectId===p.id).slice().reverse();
  if(logs.length===0)return'<div style="padding:40px 0;text-align:center;color:#888;font-size:14px">Noch keine Einträge.</div>';
  return logs.map(l=>`<div class="log-entry">
    <span class="log-time">${l.ts}</span>
    <span class="log-text">${l.by?`<strong>${USERS[l.by]?.name||l.by}:</strong> `:''}${l.text}</span>
  </div>`).join('');
}

function addLog(projectId,text){if(!state.logs)state.logs=[];state.logs.push({id:uid(),projectId,text,ts:ts(),by:activeUser?.id});}
function selectProject(id){activeProjectId=id;detailTab='tasks';renderSidebar();renderDetail();}
function switchTab(t){detailTab=t;renderDetail();}

function toggleTask(pid,tid){
  const p=state.projects.find(x=>x.id===pid);if(!p)return;
  const t=(p.tasks||[]).find(x=>x.id===tid);if(!t)return;
  t.done=!t.done;t.pct=t.done?100:Math.min(t.pct||0,99);
  recalcProgress(p);addLog(pid,`Aufgabe "${t.title}" ${t.done?'erledigt':'wieder geöffnet'}.`);
  saveState();renderAll();
}
function deleteTask(pid,tid){
  if(!confirm('Aufgabe löschen?'))return;
  const p=state.projects.find(x=>x.id===pid);if(!p)return;
  const t=(p.tasks||[]).find(x=>x.id===tid);
  p.tasks=(p.tasks||[]).filter(x=>x.id!==tid);
  recalcProgress(p);addLog(pid,`Aufgabe "${t?.title}" gelöscht.`);
  saveState();renderAll();
}

function memberPickerHtml(fieldId,selected){
  return Object.values(USERS).map(u=>`<div class="mp-chip${(selected||[]).includes(u.id)?' sel':''}"
    id="${fieldId}_${u.id}" onclick="togglePickerMember('${u.id}','${fieldId}')"
    style="${(selected||[]).includes(u.id)?`border-color:${u.color};background:${u.bg};color:${u.txt}`:''}">
    <span class="avatar-dot" style="background:${u.color};color:white;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0">${u.short}</span>
    ${u.name}</div>`).join('');
}
function togglePickerMember(uid2,fieldId){
  const el=document.getElementById(`${fieldId}_${uid2}`);if(!el)return;
  const u=USERS[uid2];
  el.classList.toggle('sel');
  if(el.classList.contains('sel')){el.style.borderColor=u.color;el.style.background=u.bg;el.style.color=u.txt;}
  else{el.style.borderColor='';el.style.background='';el.style.color='';}
}
function getPickerSelected(fieldId){return Object.keys(USERS).filter(u=>document.getElementById(`${fieldId}_${u}`)?.classList.contains('sel'));}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}

function openModal(type,pid,tid){
  const box=document.getElementById('modalBox');
  let html='';
  if(type==='newProj'){
    html=`<div class="modal-title">Neues Projekt</div>
    <div class="form-group"><label class="form-label">Projektname</label><input id="mPN" type="text" placeholder="z.B. Badezimmer OG"></div>
    <div class="form-group"><label class="form-label">Deadline</label><input id="mPD" type="date"></div>
    <div class="form-group"><label class="form-label">Zuweisen an</label><div class="member-picker">${memberPickerHtml('mp',[])}</div></div>
    <div class="modal-actions"><button class="btn primary" onclick="submitNewProj()">Erstellen</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`;
  }else if(type==='editProj'){
    const p=state.projects.find(x=>x.id===activeProjectId);
    html=`<div class="modal-title">Projekt bearbeiten</div>
    <div class="form-group"><label class="form-label">Name</label><input id="mEN" type="text" value="${p?.name||''}"></div>
    <div class="form-group"><label class="form-label">Deadline</label><input id="mED" type="date" value="${p?.deadline||''}"></div>
    <div class="form-group"><label class="form-label">Zuweisen an</label><div class="member-picker">${memberPickerHtml('ep',p?.assignees||[])}</div></div>
    <div class="modal-actions"><button class="btn primary" onclick="submitEditProj()">Speichern</button><button class="btn danger" onclick="deleteProject()">Löschen</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`;
  }else if(type==='addTask'){
    html=`<div class="modal-title">Aufgabe hinzufügen</div>
    <div class="form-group"><label class="form-label">Aufgabe</label><input id="mTT" type="text" placeholder="z.B. Elektriker beauftragen"></div>
    <div class="form-group"><label class="form-label">Zuweisen an</label><div class="member-picker">${memberPickerHtml('tp',[])}</div></div>
    <div class="form-group"><label class="form-label">Fortschritt</label>
      <div class="range-row"><input type="range" min="0" max="100" step="5" value="0" id="mTP" oninput="document.getElementById('mTPV').textContent=this.value+'%'">
      <span class="range-val" id="mTPV">0%</span></div></div>
    <div class="form-group"><label class="form-label">Deadline</label><input id="mTD" type="date"></div>
    <div class="modal-actions"><button class="btn primary" onclick="submitAddTask()">Hinzufügen</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`;
  }else if(type==='editTask'){
    const p=state.projects.find(x=>x.id===pid);
    const t=(p?.tasks||[]).find(x=>x.id===tid);
    html=`<div class="modal-title">Aufgabe bearbeiten</div>
    <div class="form-group"><label class="form-label">Aufgabe</label><input id="mETT" type="text" value="${t?.title||''}"></div>
    <div class="form-group"><label class="form-label">Zuweisen an</label><div class="member-picker">${memberPickerHtml('etp',t?.assignees||[])}</div></div>
    <div class="form-group"><label class="form-label">Fortschritt</label>
      <div class="range-row"><input type="range" min="0" max="100" step="5" value="${t?.pct||0}" id="mETP" oninput="document.getElementById('mETPV').textContent=this.value+'%'">
      <span class="range-val" id="mETPV">${t?.pct||0}%</span></div></div>
    <div class="form-group"><label class="form-label">Deadline</label><input id="mETD" type="date" value="${t?.deadline||''}"></div>
    <div class="modal-actions"><button class="btn primary" onclick="submitEditTask('${pid}','${tid}')">Speichern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`;
  }else if(type==='taskStatus'){
    const p=state.projects.find(x=>x.id===pid);
    const t=(p?.tasks||[]).find(x=>x.id===tid);
    html=`<div class="modal-title">📝 Status: ${t?.title||''}</div>
    <div style="background:#EFF6FF;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#1D4ED8;font-weight:600">Was wurde gemacht? Wie weit ist die Aufgabe?</div>
    <div class="form-group"><label class="form-label">Was wurde gemacht?</label>
      <textarea id="mTSN" rows="3" placeholder="z.B. Angebot eingeholt...">${t?.statusNote||''}</textarea></div>
    <div class="form-group"><label class="form-label">Fortschritt</label>
      <div class="range-row"><input type="range" min="0" max="100" step="5" value="${t?.pct||0}" id="mTSP" oninput="document.getElementById('mTSPV').textContent=this.value+'%'">
      <span class="range-val" id="mTSPV">${t?.pct||0}%</span></div></div>
    <div class="form-group"><label class="form-label">Ergebnis (bei Abschluss)</label>
      <textarea id="mTRN" rows="2" placeholder="Was ist herausgekommen?">${t?.resultNote||''}</textarea></div>
    <div class="modal-actions"><button class="btn primary" onclick="submitTaskStatus('${pid}','${tid}')">Speichern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`;
  }else if(type==='addStatus'){
    html=`<div class="modal-title">Notiz ins Protokoll</div>
    <div class="form-group"><label class="form-label">Notiz</label><textarea id="mST" rows="3" placeholder="Was wurde gemacht?"></textarea></div>
    <div class="modal-actions"><button class="btn primary" onclick="submitStatus()">Eintragen</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`;
  }else if(type==='addReminder'){
    html=`<div class="modal-title">🔔 Erinnerung</div>
    <div class="form-group"><label class="form-label">An wen</label>
      <select id="mRU"><option value="all">Alle</option>${Object.values(USERS).map(u=>`<option value="${u.id}">${u.name}</option>`).join('')}</select></div>
    <div class="form-group"><label class="form-label">Nachricht</label><input id="mRM" type="text" placeholder="z.B. Status aktualisieren"></div>
    <div class="form-row2">
      <div class="form-group"><label class="form-label">Datum</label><input id="mRD" type="date"></div>
      <div class="form-group"><label class="form-label">Uhrzeit</label><input id="mRT" type="time" value="09:00"></div>
    </div>
    <div class="modal-actions"><button class="btn primary" onclick="submitReminder()">Speichern</button><button class="btn" onclick="closeModal()">Abbrechen</button></div>`;
  }
  box.innerHTML=html;
  document.getElementById('modal-overlay').classList.add('open');
}

function submitNewProj(){
  const name=document.getElementById('mPN')?.value.trim();if(!name)return;
  const p={id:uid(),name,deadline:document.getElementById('mPD')?.value||'',progress:0,assignees:getPickerSelected('mp'),tasks:[],createdBy:activeUser?.id};
  state.projects.push(p);addLog(p.id,'Projekt erstellt.');
  activeProjectId=p.id;saveState();closeModal();renderAll();
}
function submitEditProj(){
  const p=state.projects.find(x=>x.id===activeProjectId);if(!p)return;
  p.name=document.getElementById('mEN')?.value.trim()||p.name;
  p.deadline=document.getElementById('mED')?.value||'';
  p.assignees=getPickerSelected('ep');
  saveState();closeModal();renderAll();
}
function deleteProject(){
  if(!confirm('Projekt wirklich löschen?'))return;
  state.projects=state.projects.filter(x=>x.id!==activeProjectId);
  state.logs=(state.logs||[]).filter(l=>l.projectId!==activeProjectId);
  state.reminders=(state.reminders||[]).filter(r=>r.projectId!==activeProjectId);
  activeProjectId=null;saveState();closeModal();renderAll();
}
function submitAddTask(){
  const title=document.getElementById('mTT')?.value.trim();if(!title)return;
  const pct=parseInt(document.getElementById('mTP')?.value||0);
  const p=state.projects.find(x=>x.id===activeProjectId);if(!p)return;
  if(!p.tasks)p.tasks=[];
  p.tasks.push({id:uid(),title,assignees:getPickerSelected('tp'),pct,deadline:document.getElementById('mTD')?.value||'',done:pct>=100,statusNote:'',resultNote:''});
  recalcProgress(p);addLog(p.id,`Aufgabe "${title}" hinzugefügt.`);
  saveState();closeModal();renderAll();
}
function submitEditTask(pid,tid){
  const p=state.projects.find(x=>x.id===pid);if(!p)return;
  const t=(p.tasks||[]).find(x=>x.id===tid);if(!t)return;
  t.title=document.getElementById('mETT')?.value.trim()||t.title;
  t.assignees=getPickerSelected('etp');
  t.pct=parseInt(document.getElementById('mETP')?.value||0);
  t.deadline=document.getElementById('mETD')?.value||'';
  t.done=t.pct>=100;recalcProgress(p);
  addLog(pid,`Aufgabe "${t.title}" aktualisiert: ${t.pct}%.`);
  saveState();closeModal();renderAll();
}
function submitTaskStatus(pid,tid){
  const p=state.projects.find(x=>x.id===pid);if(!p)return;
  const t=(p.tasks||[]).find(x=>x.id===tid);if(!t)return;
  t.statusNote=document.getElementById('mTSN')?.value.trim()||'';
  t.pct=parseInt(document.getElementById('mTSP')?.value||0);
  t.resultNote=document.getElementById('mTRN')?.value.trim()||'';
  t.done=t.pct>=100;recalcProgress(p);
  addLog(pid,`Status "${t.title}": ${t.pct}%${t.statusNote?' – '+t.statusNote:''}`);
  saveState();closeModal();renderAll();
}
function submitStatus(){
  const txt=document.getElementById('mST')?.value.trim();if(!txt)return;
  addLog(activeProjectId,txt);saveState();closeModal();renderAll();
}
function submitReminder(){
  const user=document.getElementById('mRU')?.value||'all';
  const msg=document.getElementById('mRM')?.value.trim()||'Bitte Status prüfen.';
  const date=document.getElementById('mRD')?.value;
  const time=document.getElementById('mRT')?.value||'09:00';
  if(!date){alert('Bitte Datum angeben.');return;}
  if(!state.reminders)state.reminders=[];
  state.reminders.push({id:uid(),projectId:activeProjectId,targetUser:user,message:msg,dueAt:new Date(`${date}T${time}`).toISOString(),dismissed:false});
  addLog(activeProjectId,`Erinnerung gesetzt: ${msg}`);
  saveState();closeModal();renderAll();
}

function renderAll(){renderNotifs();renderSidebar();renderDetail();}

function init(){
  document.getElementById('bg-grundriss').style.backgroundImage=`url('${GR_URI}')`;
  document.getElementById('headerDate').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(!activeUser){
    document.getElementById('userBadge').innerHTML='<span style="font-size:13px;color:#888">?user= fehlt</span>';
    document.getElementById('projList').innerHTML=`<div style="font-size:13px;color:#888;padding:12px 0;line-height:2.2">
      Zugang via Link-Parameter erforderlich.</div>`;
    renderStats();return;
  }
  const u=activeUser;
  document.getElementById('userBadge').innerHTML=`
    <span class="avatar-dot" style="background:${u.color};color:white;width:26px;height:26px;font-size:10px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center">${u.short}</span>
    <span style="color:${u.txt}">${u.name}</span>`;
  document.getElementById('userBadge').style.borderColor=u.color;
  document.getElementById('userBadge').style.background=u.bg;
  renderAll();
}

init();
</script>
</body>
</html>
